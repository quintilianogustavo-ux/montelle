<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montelle Store - Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="topo-in">
      <a class="logo" href="index.html" aria-label="Montelle Store">MONTELLE<small>ADMIN</small></a>
      <nav class="menu" aria-label="Menu principal" style="margin-left:auto">
        <a href="index.html">Loja</a>
        <a href="admin.html" aria-current="page">Área administrativa</a>
        <button class="link" id="btn-sair" type="button" hidden>Sair</button>
      </nav>
    </div>
  </header>

  <!-- Tela de login (RF09, RNF04, RN10) -->
  <section id="tela-login" class="login-caixa" aria-labelledby="t-login">
    <h1 id="t-login">Acesso restrito</h1>
    <p class="dica">Demonstração: usuário <strong>admin</strong> · senha <strong>montelle123</strong></p>
    <form id="form-login" novalidate>
      <div class="campo"><label for="lg-user">Usuário <span class="obrig">*</span></label><input id="lg-user" autocomplete="username"></div>
      <div class="campo"><label for="lg-pass">Senha <span class="obrig">*</span></label><input id="lg-pass" type="password" autocomplete="current-password"></div>
      <span class="erro" id="lg-erro" role="alert"></span>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
    </form>
  </section>

  <!-- Painel (RII12) -->
  <main id="painel" class="container" hidden>
    <div class="abas" role="tablist" aria-label="Seções do painel" id="abas">
      <button class="aba" role="tab" data-aba="produtos">Produtos</button>
      <button class="aba" role="tab" data-aba="categorias">Categorias</button>
      <button class="aba" role="tab" data-aba="estoque">Estoque</button>
      <button class="aba" role="tab" data-aba="pedidos">Pedidos</button>
      <button class="aba" role="tab" data-aba="vendas">Vendas</button>
      <button class="aba" role="tab" data-aba="auditoria">Auditoria</button>
    </div>
    <div id="conteudo" role="tabpanel" tabindex="-1"></div>
  </main>

  <!-- Janela reutilizada para formulário de produto e detalhe de pedido -->
  <dialog id="dlg" class="largo" aria-labelledby="dlg-titulo">
    <div class="dlg-topo"><h2 id="dlg-titulo">—</h2><button class="fechar" data-fechar aria-label="Fechar">×</button></div>
    <div class="dlg-corpo" id="dlg-corpo"></div>
  </dialog>

  <script src="comum.js"></script>
  <script src="admin.js"></script>
</body>
</html>
